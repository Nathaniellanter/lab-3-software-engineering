<!DOCTYPE html>
<html>
<head>
    <title>Password Verification</title>

    <script>
        function verifyPassword() {
            let password1 = document.getElementById("password1").value;
            let password2 = document.getElementById("password2").value;

            if (password1.length < 8) {
                alert("Password must be at least 8 characters long.");
            } else if (password1 !== password2) {
                alert("The passwords do not match.");
            } else {
                alert("The two passwords are matched.");
            }
        }
    </script>
</head>

<body>

    <h1>Password Verification</h1>

    <input type="text" id="password1" placeholder="Enter password">
    <br><br>

    <input type="text" id="password2" placeholder="Enter password again">
    <br><br>

    <button onclick="verifyPassword()">Validate Password</button>

</body>
</html>
